name: Build BetLand (unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          set -euxo pipefail
          # macOS runner 上按版本号取最新 Xcode，确保使用 iOS 26 SDK
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "Using: ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compute build number
        run: echo "CURRENT_PROJECT_VERSION=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build device app (unsigned)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project BetLand.xcodeproj \
            -scheme BetLand \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="build/Build/Products/Release-iphoneos/BetLand.app"
          test -d "$APP" || { echo "APP not found"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BetLand-unsigned.ipa Payload
          echo "=== IPA contents ==="
          unzip -l BetLand-unsigned.ipa | head -40
          echo "=== Size ==="
          ls -lh BetLand-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetLand-unsigned-ipa
          path: BetLand-unsigned.ipa
          if-no-files-found: error

      - name: Debug - list products on failure
        if: failure()
        run: |
          find build/Build/Products -maxdepth 2 -type d 2>/dev/null || true
          ls -la
